
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Help - letswhim</title>
      <meta name="description" content="Minimalist frontend framework.">
      <link rel="canonical" href="https://letswhim.pages.dev">
      <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"LetsWhim","url":"https://letswhim.pages.dev"}</script>

      <link rel="icon" type="image/svg+xml" href="/public/favicon.svg">
      <script src="https://cdn.tailwindcss.com"></script>
      <script src="https://unpkg.com/lucide@latest"></script>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
      <style>
        :root { --bg: #1e1f20; --text: #ffffff; --border: rgba(255,255,255,0.1); --inverse-bg: #ffffff; --inverse-text: #000000; }
        body.light-mode { --bg: #ffffff; --text: #1e1f20; --border: rgba(0,0,0,0.1); --inverse-bg: #1e1f20; --inverse-text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; transition: 0.3s; margin: 0; }
        .glass { background: rgba(125,125,125,0.03); border: 1px solid var(--border); backdrop-filter: blur(12px); }
        .text-huge { font-size: clamp(3rem, 8vw, 6rem); line-height: 0.95; letter-spacing: -0.04em; }
        #toast { visibility: hidden; min-width: 250px; background: var(--inverse-bg); color: var(--inverse-text); border-radius: 99px; padding: 14px 28px; position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px); font-size: 14px; font-weight: 600; opacity: 0; transition: 0.4s; display: flex; align-items: center; gap: 10px; z-index: 100; }
        #toast.show { visibility: visible; opacity: 1; transform: translateX(-50%) translateY(0); }
        
        /* --- LOGIC ICON MATAHARI & BULAN --- */
        .icon-moon { display: none; } /* Default: Bulan Ngumpet */
        body.light-mode .icon-sun { display: none; } /* Light Mode: Matahari Ngumpet */
        body.light-mode .icon-moon { display: block; } /* Light Mode: Bulan Muncul */
      </style>
    </head>
    <body>
      <main>
  
  <nav class="h-20 flex items-center justify-between px-6 md:px-10 sticky top-0 z-50 backdrop-blur-xl border-b bg-[var(--bg)]/80 transition-colors duration-300" style="border-color: var(--border)">
    
    <a href="index.html" class="flex items-center gap-3 hover:opacity-50 transition group">
      <img src="public/favicon.svg" class="w-6 h-6 group-hover:rotate-12 transition duration-500 opacity-80" alt="Logo">
      <span class="text-xl font-bold tracking-tighter text-[var(--text)]">
        letswhim<span class="opacity-30">.</span>
      </span>
    </a>
    
    <div class="flex items-center gap-8">
      <div class="hidden md:flex gap-8 text-sm font-medium opacity-60">
        <a href="docs.html" class="hover:opacity-100 transition text-[var(--text)]">Docs</a>
        <a href="examples.html" class="hover:opacity-100 transition text-[var(--text)]">Examples</a>
        <a href="about.html" class="hover:opacity-100 transition text-[var(--text)]">About</a>
        <a href="contact.html" class="hover:opacity-100 transition text-[var(--text)]">Help</a>
      </div>
      
      <div class="pl-6 border-l" style="border-color: var(--border)">
        
  <button onclick="toggleTheme()" class="glass w-10 h-10 rounded-full flex items-center justify-center hover:bg-[var(--text)] hover:text-[var(--bg)] transition duration-300 cursor-pointer">
    <i data-lucide="sun" class="w-5 h-5 icon-sun"></i>
    
    <i data-lucide="moon" class="w-5 h-5 icon-moon"></i>
  </button>

      </div>
    </div>
  </nav>


  <div class="min-h-[80vh] flex flex-col items-center justify-center px-6 text-center">
    
    <h1 class="text-6xl font-extrabold tracking-tightest mb-6 text-[var(--text)]">
      help center<span class="opacity-20">.</span>
    </h1>
    <p class="text-xl opacity-50 max-w-lg mb-16 text-[var(--text)]">
      Need assistance? Connect with the team.
    </p>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-3xl">
      <a href="https://github.com/guug-labs/letswhim-official/issues" target="_blank" class="glass p-10 rounded-3xl hover:border-[var(--text)]/50 transition group text-left">
        <i data-lucide="github" class="w-8 h-8 mb-6 text-[var(--text)]"></i>
        <h3 class="text-2xl font-bold mb-2 text-[var(--text)]">GitHub Issues</h3>
        <p class="text-sm opacity-50 text-[var(--text)]">Report bugs or request features.</p>
      </a>

      <a href="mailto:guuglabs@gmail.com" class="glass p-10 rounded-3xl hover:border-[var(--text)]/50 transition group text-left">
        <i data-lucide="mail" class="w-8 h-8 mb-6 text-[var(--text)]"></i>
        <h3 class="text-2xl font-bold mb-2 text-[var(--text)]">Email Support</h3>
        <p class="text-sm opacity-50 text-[var(--text)]">Direct inquiries and collaboration.</p>
      </a>
    </div>
  </div>
</main>
      <div id="toast"><i data-lucide="check-circle" class="w-4 h-4"></i><span id="toast-msg"></span></div>
      <script>
        lucide.createIcons();
        if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
        window.toggleTheme = () => {
          document.body.classList.toggle('light-mode');
          localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        }
        window.showToast = (msg) => {
          const t = document.getElementById("toast");
          document.getElementById("toast-msg").innerText = msg;
          t.className = "show";
          setTimeout(() => { t.className = ""; }, 3000);
        }
      </script>
    </body>
    </html>
