
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>letswhim - Let's just start</title>
  <style>
    * { box-sizing: border-box; }
    
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;900&display=swap');
  
  body {
    background-color: #1e1f20; /* Warna sakti dari SS lo */
    color: #e8eaed;
    font-family: 'Inter', sans-serif;
    margin: 0;
  }

  .slogan-text {
    font-size: clamp(3rem, 10vw, 6rem);
    font-weight: 900;
    letter-spacing: -0.07em;
    line-height: 0.85;
  }

  </style>
</head>
<body style="margin:0;">
  <div id="app"></div>
  <script>
    const state = new Proxy({ slogan: "Let's just start.", artifact: "Guugie Project", status: "Surviving Chapter 3" }, {
      set(target, key, value) {
        target[key] = value;
        render();
        return true;
      }
    });
    window.state = state;

    

    function render() {
      const content = "<div class=\"min-h-screen flex flex-col px-10 md:px-20 py-16\">      <nav class=\"flex justify-between items-center opacity-40 hover:opacity-100 transition-opacity\">        <span class=\"font-black tracking-tighter text-xl\">LETSWHIM. </span>        <div class=\"flex gap-8 text-xs font-bold tracking-widest\">          <span>DOCS </span>          <span>GITHUB </span>        </div>      </nav>       <main class=\"mt-40 flex-grow\">        <h1 class=\"slogan-text\">" + (state.slogan || "") + " </h1>        <p class=\"mt-8 text-lg text-gray-500 font-light max-w-lg leading-relaxed\">         The communication-first framework. Simple, fast, and unburdened by the unnecessary.        </p>      </main>       <footer class=\"mt-20 flex justify-between items-end text-[10px] text-gray-600 tracking-widest\">        <div class=\"space-y-1\">          <p class=\"uppercase font-bold text-gray-700\">Legacy </p>          <p>" + (state.artifact || "") + " </p>        </div>        <div class=\"text-right\">          <p class=\"italic mb-1\">" + (state.status || "") + " </p>          <p>&copy; 2026 GUUG LABS </p>        </div>      </footer>    </div>";
      document.getElementById('app').innerHTML = content;
      console.log("Letswhim: Rendered successfully.");
    }
    
    // Auto start
    document.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
